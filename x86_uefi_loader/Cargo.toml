[package]
name = "x86_uefi_loader"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "x86-uefi-loader"
path = "src/main.rs"

[[bin]]
name = "x86-uefi-profile-contract"
path = "src/profile_contract.rs"
required-features = ["uefi-profile-contract"]

[features]
default = ["direct-vmx"]
direct-vmx = [
    "dep:mutex",
    "dep:nested_vmx",
    "dep:uefi_variable_overlay",
    "dep:x86_64_hal",
    "x86_64_hal/vmx",
]
# Physical-selection Direct path: no Runtime Services overlay or test ESP fallback.
# BSP-only until complete pCPU/AP ownership exists; runtime rejects multiple CPUs.
physical-direct-vmx = ["direct-vmx"]
trusted-outer-kvm = []
physical-chainload = []
physical-preflight = ["dep:x86_64_hal", "x86_64_hal/vmx"]
# Dedicated QEMU fault fixture; never copy this image onto a physical ESP.
host-exception-test = ["direct-vmx"]
# Deliberately clobbers L0 SIMD registers after saving guest state; QEMU only.
host-xstate-test = ["direct-vmx"]
# Standalone firmware-backed fixture, including EBS; no VMX or installed OS.
uefi-profile-contract = ["dep:mutex", "dep:uefi_variable_overlay"]

[dependencies]
mutex = { path = "../mutex", optional = true }
nested_vmx = { path = "../nested_vmx", optional = true }
r-efi = "=6.0.0"
uefi_variable_overlay = { path = "../uefi_variable_overlay", optional = true }
x86_64_hal = { path = "../arch_hal/x86_64_hal", default-features = false, optional = true }

[lints]
workspace = true
