[package]
name = "arch_hal"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64_hal = { path = "./aarch64_hal", optional = true, default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64_hal = { path = "./x86_64_hal", optional = true }

[features]
default = ["dep:aarch64_hal", "aarch64_hal/paging", "dep:x86_64_hal"]
emergency-stack = ["dep:aarch64_hal", "aarch64_hal/emergency-stack"]
uefi-test = ["dep:aarch64_hal", "aarch64_hal/uefi-test"]
